
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Public Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .sidebar {
            width: 250px;
            height: 100vh;
            background: #123b35;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            padding: 25px 15px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 21px;
        }

        .sidebar button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 15px;
            margin-bottom: 12px;
            background: transparent;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .sidebar button:hover,
        .sidebar button.active {
            background: #25816a;
        }

        .main {
            margin-left: 250px;
            padding: 35px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 700px;
            box-shadow: 0 3px 12px #0000000d;
        }

        .hidden {
            display: none;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 18px 0 8px;
        }

        select,
        input {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }

        .submit-btn {
            margin-top: 22px;
            background: #15803d;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        .logout {
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 10px 18px;
            cursor: pointer;
        }

        .message {
            margin-top: 18px;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: static;
            }

            .sidebar h2 {
                margin-bottom: 15px;
            }

            .main {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<!-- PUBLIC SIDEBAR: ONLY TWO OPTIONS -->
<div class="sidebar">

    <h2>🚑 Ambulance Service</h2>

    <button id="emergencyMenu"
            class="active"
            onclick="showPage('emergency')">
        🚨 Emergency Registration
    </button>

    <button id="settingsMenu"
            onclick="showPage('settings')">
        ⚙️ Settings
    </button>

</div>

<div class="main">

    <div class="topbar">
        <div>
            <h1>Public Dashboard</h1>
            <p id="welcome">Loading...</p>
        </div>

        <button class="logout" onclick="logout()">
            Logout
        </button>
    </div>

    <!-- EMERGENCY REGISTRATION -->
    <div id="emergencyPage" class="card">

        <h2>Emergency Registration</h2>

        <p>Select your zone to request an ambulance.</p>

        <form id="emergencyForm">

            <label for="zone">Select Zone</label>

            <select id="zone" required>
                <option value="">Loading zones...</option>
            </select>

            <button type="submit" class="submit-btn">
                Register Emergency
            </button>

        </form>

        <p id="emergencyMessage" class="message"></p>

    </div>

    <!-- SETTINGS -->
    <div id="settingsPage" class="card hidden">

        <h2>Settings</h2>

        <h3>My Profile</h3>

        <p>
            <strong>Name:</strong>
            <span id="profileName"></span>
        </p>

        <p>
            <strong>Email:</strong>
            <span id="profileEmail"></span>
        </p>

        <p>
            <strong>Role:</strong> PUBLIC
        </p>

        <hr>

        <h3>Change Password</h3>

        <form id="passwordForm">

            <label for="currentPassword">
                Current Password
            </label>

            <input type="password"
                   id="currentPassword"
                   required>

            <label for="newPassword">
                New Password
            </label>

            <input type="password"
                   id="newPassword"
                   minlength="8"
                   required>

            <button type="submit" class="submit-btn">
                Update Password
            </button>

        </form>

        <p id="settingsMessage" class="message"></p>

    </div>

</div>

<script>

    // SIDEBAR NAVIGATION
    function showPage(page) {

        document.getElementById("emergencyPage")
            .classList.toggle(
            "hidden",
            page !== "emergency"
        );

        document.getElementById("settingsPage")
            .classList.toggle(
            "hidden",
            page !== "settings"
        );

        document.getElementById("emergencyMenu")
            .classList.toggle(
            "active",
            page === "emergency"
        );

        document.getElementById("settingsMenu")
            .classList.toggle(
            "active",
            page === "settings"
        );
    }

    // VERIFY PUBLIC LOGIN
    async function initialize() {

        try {

            const response = await fetch("/auth/me");

            if (!response.ok) {
                window.location.replace("/login.html");
                return;
            }

            const user = await response.json();

            if (user.role !== "PUBLIC") {

                if (user.role === "ADMIN") {
                    window.location.replace("/index.html");
                } else if (user.role === "STAFF") {
                    window.location.replace("/staff.html");
                } else {
                    window.location.replace("/login.html");
                }

                return;
            }

            document.getElementById("welcome")
                .textContent =
                "Welcome, " + user.fullName;

            document.getElementById("profileName")
                .textContent = user.fullName;

            document.getElementById("profileEmail")
                .textContent = user.email;

            await loadZones();

        } catch (error) {

            document.getElementById("welcome")
                .textContent =
                "Unable to connect to server.";
        }
    }

    // LOAD ZONES INTO DROPDOWN
    async function loadZones() {

        const select =
            document.getElementById("zone");

        try {

            const response = await fetch("/zone");

            if (!response.ok) {
                throw new Error("Unable to load zones");
            }

            const zones = await response.json();

            select.innerHTML =
                '<option value="">Select Zone</option>';

            zones.forEach(zone => {

                const option =
                    document.createElement("option");

                option.value = zone.id;

                option.textContent =
                    zone.zoneName ||
                    zone.name ||
                    "Zone " + zone.id;

                select.appendChild(option);
            });

        } catch (error) {

            select.innerHTML =
                '<option value="">Zones unavailable</option>';
        }
    }

    // REGISTER EMERGENCY
    document.getElementById("emergencyForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const zoneId =
                    document.getElementById("zone").value;

                const message =
                    document.getElementById(
                        "emergencyMessage"
                    );

                if (!zoneId) {
                    message.textContent =
                        "Please select your zone.";
                    return;
                }

                const button =
                    this.querySelector(
                        'button[type="submit"]'
                    );

                button.disabled = true;
                message.textContent =
                    "Submitting emergency request...";

                try {

                    const response = await fetch(
                        "/emergency/" +
                        encodeURIComponent(zoneId) +
                        "?priority=NORMAL",
                        {
                            method: "POST"
                        }
                    );

                    if (response.status === 401) {
                        window.location.replace(
                            "/login.html"
                        );
                        return;
                    }

                    if (!response.ok) {
                        throw new Error(
                            "Registration failed: " +
                            response.status
                        );
                    }

                    const call =
                        await response.json();

                    message.style.color = "green";

                    message.textContent =
                        "Emergency registered successfully! " +
                        "Request ID: " + call.id +
                        " | Status: " + call.status;

                } catch (error) {

                    message.style.color = "red";
                    message.textContent =
                        error.message;

                } finally {

                    button.disabled = false;
                }
            }
        );

    // CHANGE PASSWORD
    document.getElementById("passwordForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const message =
                    document.getElementById(
                        "settingsMessage"
                    );

                const currentPassword =
                    document.getElementById(
                        "currentPassword"
                    ).value;

                const newPassword =
                    document.getElementById(
                        "newPassword"
                    ).value;

                try {

                    const response = await fetch(
                        "/auth/change-password",
                        {
                            method: "PUT",
                            headers: {
                                "Content-Type":
                                    "application/json"
                            },
                            body: JSON.stringify({
                                currentPassword,
                                newPassword
                            })
                        }
                    );

                    if (!response.ok) {
                        throw new Error(
                            "Password update failed."
                        );
                    }

                    message.style.color = "green";

                    message.textContent =
                        "Password updated successfully.";

                    document.getElementById(
                        "passwordForm"
                    ).reset();

                } catch (error) {

                    message.style.color = "red";

                    message.textContent =
                        error.message;
                }
            }
        );

    // LOGOUT
    async function logout() {

        try {

            await fetch("/auth/logout", {
                method: "POST"
            });

        } finally {

            window.location.replace(
                "/login.html"
            );
        }
    }

    initialize();

</script>

</body>
</html>

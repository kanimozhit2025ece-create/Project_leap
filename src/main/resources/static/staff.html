
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Staff Dashboard</title>
    <link rel="stylesheet" href="/auth.css">

    <style>
        body {
            display: block;
            padding: 25px;
            background: #f1f5f9;
        }

        .dashboard {
            max-width: 1100px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        .small-button {
            width: auto;
            margin: 4px;
            padding: 9px 14px;
        }

        select {
            padding: 9px;
            border-radius: 6px;
        }
    </style>
</head>

<body>
<div class="dashboard">

    <header>
        <div>
            <h1>🚑 Staff Dashboard</h1>
            <p id="welcome"></p>
        </div>

        <button class="small-button"
                onclick="logout()">Logout</button>
    </header>

    <div class="panel">
        <h2>Emergency Calls</h2>
        <div id="emergencyList">Loading...</div>
    </div>

    <div class="panel">
        <h2>Ambulance Locations</h2>
        <div id="ambulanceList">Loading...</div>
    </div>

    <p id="message"></p>

</div>

<script>
    let zones = [];

    function showMessage(text) {
        document.getElementById("message").textContent = text;
    }

    async function api(url, options = {}) {
        const response = await fetch(url, options);

        if (response.status === 401) {
            window.location.href = "/login.html";
            throw new Error("Please login");
        }

        if (!response.ok) {
            throw new Error("Request failed: " + response.status);
        }

        return response.json();
    }

    async function initialize() {
        try {
            const user = await api("/auth/me");

            if (user.role !== "STAFF") {
                window.location.href = "/";
                return;
            }

            document.getElementById("welcome").textContent =
                "Welcome, " + user.fullName;

            zones = await api("/zone");

            await refreshDashboard();

        } catch (error) {
            showMessage(error.message);
        }
    }

    async function refreshDashboard() {
        await Promise.all([
            loadEmergencies(),
            loadAmbulances()
        ]);
    }

    async function loadEmergencies() {
        const calls = await api("/emergency");

        const rows = calls.map(call => {
            let action = "-";

            if (call.status === "ASSIGNED") {
                action = `
                <button class="small-button"
                    onclick="updateEmergency(${call.id}, 'arrived')">
                    Mark Arrived
                </button>`;
            }

            if (call.status === "ARRIVED") {
                action = `
                <button class="small-button"
                    onclick="updateEmergency(${call.id}, 'complete')">
                    Complete
                </button>`;
            }

            return `
            <tr>
                <td>${call.id}</td>
                <td>${call.callerZone?.zoneName || "-"}</td>
                <td>${call.priority || "-"}</td>
                <td>${call.ambulance?.ambulanceNumber || "-"}</td>
                <td>${call.status}</td>
                <td>${action}</td>
            </tr>`;
        }).join("");

        document.getElementById("emergencyList").innerHTML = `
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Zone</th>
                    <th>Priority</th>
                    <th>Ambulance</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>${rows}</tbody>
        </table>`;
    }

    async function loadAmbulances() {
        const ambulances = await api("/ambulance");

        const rows = ambulances.map(ambulance => {

            const zoneOptions = zones.map(zone => `
            <option value="${zone.id}"
                ${ambulance.currentZone?.id === zone.id
                ? "selected" : ""}>
                ${zone.zoneName}
            </option>
        `).join("");

            return `
            <tr>
                <td>${ambulance.ambulanceNumber}</td>
                <td>${ambulance.status}</td>
                <td>${ambulance.currentZone?.zoneName || "-"}</td>
                <td>
                    <select id="zone-${ambulance.id}">
                        ${zoneOptions}
                    </select>
                    <button class="small-button"
                        onclick="updateLocation(${ambulance.id})">
                        Update
                    </button>
                </td>
            </tr>`;
        }).join("");

        document.getElementById("ambulanceList").innerHTML = `
        <table>
            <thead>
                <tr>
                    <th>Ambulance</th>
                    <th>Status</th>
                    <th>Current Zone</th>
                    <th>Update Location</th>
                </tr>
            </thead>
            <tbody>${rows}</tbody>
        </table>`;
    }

    async function updateEmergency(id, action) {
        try {
            await api(`/emergency/${id}/${action}`, {
                method: "PUT"
            });

            showMessage("Emergency updated successfully");
            await refreshDashboard();

        } catch (error) {
            showMessage(error.message);
        }
    }

    async function updateLocation(id) {
        const zoneId =
            document.getElementById(`zone-${id}`).value;

        try {
            await api(`/ambulance/${id}/location/${zoneId}`, {
                method: "PUT"
            });

            showMessage("Location updated successfully");
            await refreshDashboard();

        } catch (error) {
            showMessage(error.message);
        }
    }

    async function logout() {
        await fetch("/auth/logout", {
            method: "POST"
        });

        window.location.href = "/login.html";
    }

    initialize();
</script>
</body>
</html>
